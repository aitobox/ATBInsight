    <desc id="d1">The workflow is a chain of steps, all alike. Each turn, the model decides, which is a call to the LLM; then the chosen tool runs: get quotes from the supplier, then draft the PO in the ERP. Each step is the only place the workflow reaches the world. Between turns, the code applies the tool's result and works out which tools are allowed next. The dotted line shows the loop goes on.</desc>
    <defs><marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#5C7D88" stroke-width="1.5"/></marker></defs>
