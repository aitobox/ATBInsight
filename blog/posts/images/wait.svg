<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="dw">
<style>
.title { font: 600 15px Inter, sans-serif; fill: #003D4F; }
.label { font: 500 13px Inter, sans-serif; fill: #003D4F; }
.note { font: 400 13px Inter, sans-serif; fill: #5C7D88; }
.hot { font: 600 13px Inter, sans-serif; fill: #F2617A; }
.io { font: 500 10px Inter, sans-serif; fill: #5C7D88; letter-spacing: 0.04em; }
</style>
    <desc id="dw">A wait, close up. The workflow starts a wait for the manager's approval, with a timer of three days; the timer is written to the log. No process is held and no compute is used while it waits. The manager's approval arrives as a message, is written to the log, and the workflow wakes and carries on.</desc>
    <defs><marker id="bw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#5C7D88" stroke-width="1.5"/></marker></defs>
    <text x="20" y="54" class="title">the world</text>
    <text x="20" y="164" class="title">the workflow</text>
    <text x="20" y="284" class="title">the log</text>
    <!-- before the wait, faint -->
    <line x1="140" y1="160" x2="300" y2="160" stroke="#003D4F" stroke-width="1.75"/>
    <g fill="#F2617A" opacity="0.3"><rect x="176" y="148" width="24" height="24" rx="4"/><rect x="240" y="148" width="24" height="24" rx="4"/></g>
    <!-- the wait -->
    <rect x="300" y="152" width="300" height="16" rx="8" fill="#D5EAED"/>
    <circle cx="300" cy="160" r="5" fill="#47A1AD"/>
    <text x="450" y="200" text-anchor="middle" class="note">no process, no compute while it waits</text>
    <!-- after the wake -->
    <line x1="600" y1="160" x2="800" y2="160" stroke="#003D4F" stroke-width="1.75"/>
    <rect x="660" y="148" width="24" height="24" rx="4" fill="#F2617A"/>
    <text x="612" y="146" class="hot">wakes</text>
    <!-- the manager and the message -->
    <rect x="540" y="32" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#DCE3E6" stroke-width="1.5"/>
    <text x="600" y="54" text-anchor="middle" class="label">manager</text>
    <line x1="600" y1="70" x2="600" y2="148" stroke="#5C7D88" stroke-width="1.5" marker-end="url(#bw)"/>
    <text x="590" y="102" text-anchor="end" class="label">message</text>
    <text x="590" y="119" text-anchor="end" class="note">approval, $4.20</text>
    <!-- written down -->
    <path d="M300 168 L300 200 C300 222, 360 222, 360 246" fill="none" stroke="#5C7D88" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#bw)"/>
    <path d="M600 168 L600 246" fill="none" stroke="#5C7D88" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#bw)"/>
    <rect x="150" y="252" width="130" height="50" rx="5" fill="#EDF1F3" opacity="0.6"/>
    <text x="215" y="290" text-anchor="middle" class="note">steps so far</text>
    <rect x="290" y="252" width="150" height="50" rx="5" fill="#EDF1F3"/>
    <text x="302" y="268" class="io">TIMER</text>
    <text x="365" y="290" text-anchor="middle" class="label">3 days</text>
    <rect x="525" y="252" width="150" height="50" rx="5" fill="#EDF1F3"/>
    <text x="537" y="268" class="io">MESSAGE</text>
    <text x="600" y="290" text-anchor="middle" class="label">approval, $4.20</text>
  </svg>
