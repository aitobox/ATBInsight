<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-labelledby="o3b">
<style>
.title { font: 600 15px Inter, sans-serif; fill: #003D4F; }
.note { font: 400 13px Inter, sans-serif; fill: #5C7D88; }
.hot { font: 600 13px Inter, sans-serif; fill: #F2617A; }
</style>
    <desc id="o3b">The same log and step positions. The first run executes four steps (decide, get quotes, draft PO and ask approval), then crashes while waiting. Run again passes over the four recorded steps without running them, while the code between them runs again; then place order runs for real and is written to the log.</desc>
    <defs>
      <marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#F2617A" stroke-width="1.5"/></marker>
    </defs>
    <text x="20" y="44" class="title">the log</text>
    <g fill="#EDF1F3">
      <rect x="160" y="24" width="90" height="34" rx="4"/><rect x="290" y="24" width="90" height="34" rx="4"/>
      <rect x="420" y="24" width="90" height="34" rx="4"/><rect x="550" y="24" width="90" height="34" rx="4"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="2">
      <line x1="205" y1="24" x2="205" y2="58"/><line x1="335" y1="24" x2="335" y2="58"/><line x1="465" y1="24" x2="465" y2="58"/><line x1="595" y1="24" x2="595" y2="58"/>
    </g>
    <rect x="680" y="24" width="90" height="34" rx="4" fill="#FFFFFF" stroke="#F2617A" stroke-width="1.5"/>
    <line x1="725" y1="24" x2="725" y2="58" stroke="#F2617A" stroke-width="1"/>
    <!-- first run -->
    <text x="20" y="144" class="title">first run</text>
    <line x1="140" y1="140" x2="640" y2="140" stroke="#003D4F" stroke-width="2"/>
    <g fill="#F2617A">
      <rect x="175" y="130" width="60" height="20" rx="4"/><rect x="305" y="130" width="60" height="20" rx="4"/>
      <rect x="435" y="130" width="60" height="20" rx="4"/><rect x="565" y="130" width="60" height="20" rx="4"/>
    </g>
    <g stroke="#F2617A" stroke-width="3" stroke-linecap="round"><line x1="648" y1="130" x2="668" y2="150"/><line x1="668" y1="130" x2="648" y2="150"/></g>
    <text x="680" y="145" class="hot">crash</text>
    <!-- run again -->
    <text x="20" y="214" class="title">run again</text>
    <line x1="140" y1="210" x2="670" y2="210" stroke="#003D4F" stroke-width="2" stroke-dasharray="5 5"/>
    <g fill="#FFFFFF" stroke="#5C7D88" stroke-width="1.5" stroke-dasharray="3 2">
      <rect x="175" y="200" width="60" height="20" rx="4"/><rect x="305" y="200" width="60" height="20" rx="4"/>
      <rect x="435" y="200" width="60" height="20" rx="4"/><rect x="565" y="200" width="60" height="20" rx="4"/>
    </g>
    <text x="400" y="242" text-anchor="middle" class="note">recorded steps return their outputs; the code between them runs again</text>
    <line x1="672" y1="210" x2="800" y2="210" stroke="#F2617A" stroke-width="2.5" marker-end="url(#a6)"/>
    <rect x="695" y="200" width="60" height="20" rx="4" fill="#F2617A"/>
    <text x="725" y="242" text-anchor="middle" class="hot">runs</text>
  </svg>
