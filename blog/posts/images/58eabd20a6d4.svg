<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The contribution of generation loop changes</title>
  <desc id="desc">Horizontal bars compare generation throughput before and after two Transformers generation loop changes.</desc>
  <style>.ink{fill:#18272d;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#68777c;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  <rect width="1200" height="760" fill="#f8f7f3"/>
  <text x="72" y="66" class="ink" font-size="30" font-weight="700">Generation loop contribution</text>
  <text x="72" y="100" class="muted" font-size="18">All layer kernels enabled in both runs · tokens per second</text>
  <rect x="770" y="48" width="18" height="18" rx="4" fill="#a2b2b6"/><text x="800" y="64" class="ink" font-size="17">Before changes</text>
  <rect x="976" y="48" width="18" height="18" rx="4" fill="#ffd446"/><text x="1006" y="64" class="ink" font-size="17">After changes</text>
  <g stroke="#d8dcd9"><line x1="390" y1="145" x2="390" y2="680"/><line x1="525" y1="145" x2="525" y2="680"/><line x1="660" y1="145" x2="660" y2="680"/><line x1="795" y1="145" x2="795" y2="680"/><line x1="930" y1="145" x2="930" y2="680"/><line x1="1065" y1="145" x2="1065" y2="680"/></g>
  <g class="muted" font-size="16" text-anchor="middle"><text x="390" y="710">0</text><text x="525" y="710">20</text><text x="660" y="710">40</text><text x="795" y="710">60</text><text x="930" y="710">80</text><text x="1065" y="710">tok/s</text></g>
  <g class="ink"><text x="72" y="184" font-size="23" font-weight="700">Qwen3.5-4B</text><text x="72" y="210" class="muted mono" font-size="16">Q4_K_M · 1.42×</text><text x="72" y="353" font-size="23" font-weight="700">Qwen3.8-27B</text><text x="72" y="379" class="muted mono" font-size="16">UD-Q4_K_M · 1.16×</text><text x="72" y="522" font-size="23" font-weight="700">Qwen3.5-35B-A3B</text><text x="72" y="548" class="muted mono" font-size="16">UD-IQ4_XS · 1.79×</text></g>
  <g><rect x="390" y="160" width="334.8" height="30" rx="7" fill="#a2b2b6"/><rect x="390" y="202" width="475.3" height="30" rx="7" fill="#ffd446"/><text x="737" y="183" class="ink" font-size="18" font-weight="700">49.6</text><text x="878" y="225" class="ink" font-size="18" font-weight="700">70.4</text><rect x="390" y="329" width="92.5" height="30" rx="7" fill="#a2b2b6"/><rect x="390" y="371" width="107.3" height="30" rx="7" fill="#ffd446"/><text x="494" y="352" class="ink" font-size="18" font-weight="700">13.7</text><text x="510" y="394" class="ink" font-size="18" font-weight="700">15.9</text><rect x="390" y="498" width="227.5" height="30" rx="7" fill="#a2b2b6"/><rect x="390" y="540" width="406.4" height="30" rx="7" fill="#ffd446"/><text x="629" y="521" class="ink" font-size="18" font-weight="700">33.7</text><text x="809" y="563" class="ink" font-size="18" font-weight="700">60.2</text></g>
  <text x="72" y="744" class="muted" font-size="15">Changes: remove an unnecessary attention mask early and defer the stopping check.</text>
</svg>
