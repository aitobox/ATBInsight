site_name = "ATBInsight"
site_url = "https://insight.aitobox.com/"
site_description = "AI Insight Pipeline & Tech Blog"
site_author = "艾特创思"

nav = [
  {"首页" = "index.md"},
  {"产品发布" = "blog/category/产品发布.md"},
  {"工具教程" = "blog/category/工具教程.md"},
  {"研究解读" = "blog/category/研究解读.md"},
  {"商业动态" = "blog/category/商业动态.md"},
  {"其他" = "blog/category/其他.md"}
]

markdown_extensions = [
  "pymdownx.highlight",
  "pymdownx.superfences",
  "pymdownx.inlinehilite",
  { "pymdownx.arithmatex" = { generic = true } },
  "tables",
  "attr_list"
]

[[plugins]]
name = "search"

[[plugins]]
name = "tags"
tags_file = "tags.md"

[[plugins]]
name = "blog"
post_dir = "blog/posts"
post_url_format = "{date}/{slug}"
archive = true
categories = true
authors = true

[[plugins]]
name = "rss"
length = 50
match_path = ".*blog/posts/.*"

[theme]
name = "material"
language = "zh"
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.top",
  "search.suggest",
  "search.highlight"
]

[[theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
[theme.palette.toggle]
icon = "material/brightness-7"
name = "切换到暗黑模式"

[[theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
[theme.palette.toggle]
icon = "material/brightness-4"
name = "切换到浅色模式"
