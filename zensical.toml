site_name = "ATBInsight"
site_url = "https://aitobox.github.io/ATBInsight/"
site_description = "AI Insight Pipeline & Tech Blog"

[theme]
name = "material"
language = "zh"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.top",
  "search.suggest",
  "search.highlight"
]

[[theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
[theme.palette.toggle]
icon = "material/brightness-7"
name = "切换到暗黑模式"

[[theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
[theme.palette.toggle]
icon = "material/brightness-4"
name = "切换到浅色模式"

nav = [
  {"首页" = "index.md"},
  {"深度研报" = "blog/category/深度研报/"},
  {"标签浏览" = "tags.md"},
  {"AIToBox周报" = "https://newsweekly.aitobox.com"},
  {"邮箱订阅" = "https://stats.sender.net/forms/e9rM7P/view"}
]

plugins = [
  "search",
  { tags = { tags_file = "tags.md" } },
  { blog = { post_dir = "blog/posts", post_url_format = "{date}/{slug}", archive = true, categories = true, authors = true } }
]

markdown_extensions = [
  "pymdownx.highlight",
  "pymdownx.superfences",
  "pymdownx.inlinehilite",
  { "pymdownx.arithmatex" = { generic = true } },
  "tables",
  "attr_list"
]
