<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="aw">
<style>
.title { font: 600 15px Inter, sans-serif; fill: #003D4F; }
.label { font: 500 13px Inter, sans-serif; fill: #003D4F; }
.note { font: 400 13px Inter, sans-serif; fill: #5C7D88; }
</style>
    <desc id="aw">Two agents, one per SKU, each running indefinitely. The agent for SKU-123 starts a replenishment workflow, waits for it to finish, and later starts a second one: one at a time. A message for SKU-123 goes to its agent, which passes it to the running workflow. At the same time, the agent for SKU-456 runs its own replenishment workflow.</desc>
    <defs>
      <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#5C7D88" stroke-width="1.5"/></marker>
      <marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#003D4F" stroke-width="1.5"/></marker>
    </defs>

    <!-- Agent: SKU-123 -->
    <rect x="20" y="56" width="140" height="34" rx="17" fill="#FFFFFF" stroke="#003D4F" stroke-width="1.75"/>
    <text x="90" y="78" text-anchor="middle" class="title">agent · SKU-123</text>
    <line x1="160" y1="73" x2="870" y2="73" stroke="#003D4F" stroke-width="1.75" marker-end="url(#mw)"/>

    <!-- its workflows, one at a time -->
    <path d="M220 73 L220 126" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#m)"/>
    <rect x="210" y="130" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#F2617A" stroke-width="1.5"/>
    <g fill="#F2617A"><rect x="226" y="140" width="16" height="16" rx="3"/><rect x="266" y="140" width="16" height="16" rx="3"/><rect x="306" y="140" width="16" height="16" rx="3"/><rect x="386" y="140" width="16" height="16" rx="3"/><rect x="426" y="140" width="16" height="16" rx="3"/></g>
    <line x1="330" y1="148" x2="378" y2="148" stroke="#D5EAED" stroke-width="8" stroke-linecap="round"/>
    <path d="M460 148 C480 148, 480 80, 480 79" stroke="#5C7D88" stroke-width="1.25" stroke-dasharray="3 3" fill="none" marker-end="url(#m)"/>
    <text x="335" y="186" text-anchor="middle" class="label">replenishment 1</text>

    <path d="M620 73 L620 126" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#m)"/>
    <rect x="610" y="130" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#F2617A" stroke-width="1.5"/>
    <g fill="#F2617A"><rect x="626" y="140" width="16" height="16" rx="3"/><rect x="666" y="140" width="16" height="16" rx="3"/><rect x="706" y="140" width="16" height="16" rx="3"/><rect x="786" y="140" width="16" height="16" rx="3"/><rect x="826" y="140" width="16" height="16" rx="3"/></g>
    <line x1="730" y1="148" x2="778" y2="148" stroke="#D5EAED" stroke-width="8" stroke-linecap="round"/>
    <text x="735" y="186" text-anchor="middle" class="label">replenishment 2</text>
    <text x="540" y="152" text-anchor="middle" class="note">one at a time</text>

    <!-- a message, to the agent, passed on -->
    <path d="M354 22 L362 30 L354 38 L346 30 Z" fill="#FFFFFF" stroke="#F2617A" stroke-width="1.75"/>
    <text x="370" y="35" class="note">approval</text>
    <line x1="354" y1="40" x2="354" y2="67" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#m)"/>
    <line x1="354" y1="79" x2="354" y2="136" stroke="#5C7D88" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#m)"/>

    <!-- Agent: SKU-456 -->
    <rect x="20" y="226" width="140" height="34" rx="17" fill="#FFFFFF" stroke="#003D4F" stroke-width="1.75"/>
    <text x="90" y="248" text-anchor="middle" class="title">agent · SKU-456</text>
    <line x1="160" y1="243" x2="870" y2="243" stroke="#003D4F" stroke-width="1.75" marker-end="url(#mw)"/>
    <path d="M330 243 L330 296" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#m)"/>
    <rect x="320" y="300" width="300" height="36" rx="6" fill="#FFFFFF" stroke="#F2617A" stroke-width="1.5"/>
    <g fill="#F2617A"><rect x="336" y="310" width="16" height="16" rx="3"/><rect x="376" y="310" width="16" height="16" rx="3"/><rect x="416" y="310" width="16" height="16" rx="3"/><rect x="546" y="310" width="16" height="16" rx="3"/><rect x="586" y="310" width="16" height="16" rx="3"/></g>
    <line x1="440" y1="318" x2="538" y2="318" stroke="#D5EAED" stroke-width="8" stroke-linecap="round"/>
    <text x="470" y="356" text-anchor="middle" class="label">replenishment 1</text>

    <text x="880" y="64" text-anchor="end" class="note">runs indefinitely</text>
  </svg>
