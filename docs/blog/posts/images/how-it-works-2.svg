<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="d2">
<style>
.title { font: 600 15px Inter, sans-serif; fill: #003D4F; }
.label { font: 500 13px Inter, sans-serif; fill: #003D4F; }
.note { font: 400 13px Inter, sans-serif; fill: #5C7D88; }
.io { font: 500 10px Inter, sans-serif; fill: #5C7D88; letter-spacing: 0.04em; }
.num { font: 600 12px Inter, sans-serif; fill: #FFFFFF; }
</style>
    <desc id="d2">One step, place order, close up. It sends its input, PO 4471, to the supplier, and gets its output, SO-1, back. The input is written to the step's entry in the log before the call, the output after it returns, and both before the workflow moves on.</desc>
    <defs><marker id="b2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#5C7D88" stroke-width="1.5"/></marker></defs>
    <text x="20" y="54" class="title">the world</text>
    <text x="20" y="164" class="title">the workflow</text>
    <text x="20" y="284" class="title">the log</text>
    <!-- the rest of the chain, faint -->
    <line x1="140" y1="160" x2="800" y2="160" stroke="#003D4F" stroke-width="1.75"/>
    <g fill="#F2617A" opacity="0.3"><rect x="187" y="146" width="50" height="28" rx="3"/><rect x="267" y="146" width="50" height="28" rx="3"/><rect x="687" y="146" width="50" height="28" rx="3"/></g>
    <!-- the supplier -->
    <rect x="370" y="32" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#DCE3E6" stroke-width="1.5"/>
    <text x="430" y="54" text-anchor="middle" class="label">supplier</text>
    <!-- the step -->
    <rect x="380" y="132" width="100" height="56" rx="6" fill="#F2617A"/>
    <text x="430" y="165" text-anchor="middle" class="num" style="font-size:13px">place order</text>
    <!-- out and back -->
    <line x1="408" y1="130" x2="408" y2="72" stroke="#5C7D88" stroke-width="1.5" marker-end="url(#b2)"/>
    <line x1="452" y1="70" x2="452" y2="128" stroke="#5C7D88" stroke-width="1.5" marker-end="url(#b2)"/>
    <text x="398" y="98" text-anchor="end" class="label">input</text>
    <text x="398" y="115" text-anchor="end" class="note">PO 4471</text>
    <text x="462" y="98" class="label">output</text>
    <text x="462" y="115" class="note">SO-1</text>
    <!-- written down -->
    <path d="M408 190 L408 200 C408 222, 330 222, 330 246" fill="none" stroke="#5C7D88" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#b2)"/>
    <path d="M452 190 L452 200 C452 222, 530 222, 530 246" fill="none" stroke="#5C7D88" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#b2)"/>
    <rect x="250" y="252" width="360" height="50" rx="5" fill="#EDF1F3"/>
    <line x1="430" y1="252" x2="430" y2="302" stroke="#FFFFFF" stroke-width="2"/>
    <text x="262" y="268" class="io">INPUT</text><text x="442" y="268" class="io">OUTPUT</text>
    <text x="340" y="290" text-anchor="middle" class="label">PO 4471</text>
    <text x="520" y="290" text-anchor="middle" class="label">SO-1</text>
    <text x="340" y="324" text-anchor="middle" class="note">written before the call</text>
    <text x="520" y="324" text-anchor="middle" class="note">written after it returns</text>
  </svg>
