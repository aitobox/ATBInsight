<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="loopDesc">
<style>
.title { font: 600 15px Inter, sans-serif; fill: #003D4F; }
.label { font: 500 13px Inter, sans-serif; fill: #003D4F; }
.note { font: 400 13px Inter, sans-serif; fill: #5C7D88; }
.code { font: 500 12.5px ui-monospace, Menlo, monospace; fill: #003D4F; }
.dur { font: 500 12px Inter, sans-serif; fill: #5C7D88; }
.dur.long { fill: #47A1AD; }
</style>
      <desc id="loopDesc">A sequence diagram of two turns of the loop, with three participants: the harness, the model, and the outside world. First turn: the harness calls decide(GOAL, state, allowed_tools) on the model, which returns get_quotes; the harness runs tool.execute(state, context), which requests quotes from the outside world and gets them back; then tool.apply(state, result), which updates state. Second turn: the model returns wait_for_approval; the harness waits, hours to weeks, until the manager's approval arrives, then runs tool.apply(state, payload), which updates state.</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0 1 L9 5 L0 9" fill="none" stroke="#5C7D88" stroke-width="1.5"/>
        </marker>
      </defs>
      <g text-anchor="middle">
        <text x="100" y="34" class="title">harness</text>
        <text x="375" y="34" class="title">model</text>
        <text x="600" y="34" class="title">outside world</text>
      </g>
      <g stroke="#DCE3E6" stroke-width="1.5">
        <line x1="100" y1="64" x2="100" y2="548"/><line x1="375" y1="64" x2="375" y2="548"/>
        <line x1="600" y1="64" x2="600" y2="548"/>
      </g>
      <rect x="93" y="374" width="14" height="92" fill="#D5EAED"/>
      <text x="118" y="424" class="dur long">Hours to weeks</text>
      <line x1="102" y1="96" x2="373" y2="96" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#arrow)"/>
      <text x="237" y="89" text-anchor="middle" class="code">decide(GOAL, state, allowed_tools)</text>
      <line x1="373" y1="122" x2="102" y2="122" stroke="#5C7D88" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text x="237" y="115" text-anchor="middle" class="code">get_quotes</text>
      <path d="M102 146 H134 V164 H104" fill="none" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#arrow)"/>
      <text x="142" y="159" class="code">tool.execute(state, context)</text>
      <line x1="102" y1="200" x2="598" y2="200" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#arrow)"/>
      <text x="487" y="193" text-anchor="middle" class="label">request quotes</text>
      <line x1="598" y1="226" x2="102" y2="226" stroke="#5C7D88" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text x="487" y="219" text-anchor="middle" class="label">quotes</text>
      <path d="M102 250 H134 V268 H104" fill="none" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#arrow)"/>
      <text x="142" y="263" class="code">tool.apply(state, result)</text>
      <text x="142" y="280" class="note">updates state</text>
      <line x1="102" y1="334" x2="373" y2="334" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#arrow)"/>
      <text x="237" y="327" text-anchor="middle" class="code">decide(GOAL, state, allowed_tools)</text>
      <line x1="373" y1="360" x2="102" y2="360" stroke="#5C7D88" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text x="237" y="353" text-anchor="middle" class="code">wait_for_approval</text>
      <line x1="598" y1="480" x2="102" y2="480" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#arrow)"/>
      <text x="487" y="473" text-anchor="middle" class="label">manager's approval</text>
      <path d="M102 500 H134 V518 H104" fill="none" stroke="#5C7D88" stroke-width="1.25" marker-end="url(#arrow)"/>
      <text x="142" y="513" class="code">tool.apply(state, payload)</text>
      <text x="142" y="530" class="note">updates state</text>
    </svg>
